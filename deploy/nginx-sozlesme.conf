# ---------------------------------------------------------------------------
# Sözleşme Mevzuat Etki Analizi - nginx yapılandırması
#
# Bu bloklar MEVCUT server { } bloğunun İÇİNE eklenir (aynı sunucuda başka
# uygulamalar da çalıştığı için ayrı server bloğu açılmaz). Örnek:
#   sudo cp deploy/nginx-sozlesme.conf /etc/nginx/snippets/sozlesme.conf
#   # mevcut server { } içine:   include snippets/sozlesme.conf;
#   sudo nginx -t && sudo systemctl reload nginx
# ---------------------------------------------------------------------------

# Sonunda "/" olmadan gelen istekleri yönlendir (frontend göreli URL kullanır).
location = /sozlesme {
    return 301 /sozlesme/;
}

location /sozlesme/ {
    # Sondaki "/" ÖNEMLİ: /sozlesme/ önekini kaldırır; uvicorn --root-path /sozlesme
    # ile önek uygulama tarafında yeniden eklenir.
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Prefix /sozlesme;

    # Sohbet cevapları SSE ile akar: tamponlama kapalı, uzun okuma süresi.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Mevzuat PDF yükleme sınırı (.env MAX_UPLOAD_MB değerinden biraz büyük olmalı).
    client_max_body_size 30m;
}

# ---------------------------------------------------------------------------
